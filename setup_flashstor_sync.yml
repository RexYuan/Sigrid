
---
- name: Set up rsync synchronization on Flashstor
  hosts: flashstor,flashstor-offsite
  become: true
  gather_facts: false

  vars:
    rsync_push_path: /home/rex/bin/rsync-push

    sync_hosts:
      flashstor:
        hostname: FS6712X-251D
        namespace: Rex
        remote: ts-flashstor-offsite
        hour: "13"

      flashstor-offsite:
        hostname: FS6712X-87BC
        namespace: YingTing
        remote: ts-flashstor
        hour: "1"

    sync_config: "{{ sync_hosts[inventory_hostname] }}"

    sync_command: >-
      {{ rsync_push_path }} {{ sync_config.namespace }} {{ sync_config.remote }}

    sync_cron: >-
      0 {{ sync_config.hour }} * * * {{ sync_command }}

  tasks:
    ########################################
    # Validate host
    ########################################
    - name: Verify inventory host is supported
      assert:
        that:
          - inventory_hostname in sync_hosts
        success_msg: "PASSED: {{ inventory_hostname }} is a supported NAS."
        fail_msg: "FAILED: Unsupported inventory host: {{ inventory_hostname }}"

    - name: Identify NAS hostname
      command: uname -n
      register: nas_hostname
      changed_when: false
      check_mode: false

    - name: Show synchronization configuration
      debug:
        msg:
          - "Inventory : {{ inventory_hostname }}"
          - "Detected  : {{ nas_hostname.stdout }}"
          - "Expected  : {{ sync_config.hostname }}"
          - "Namespace : {{ sync_config.namespace }}"
          - "Remote    : {{ sync_config.remote }}"
          - "Cron      : {{ sync_cron }}"

    - name: Validate NAS identity
      assert:
        that:
          - nas_hostname.stdout == sync_config.hostname
        success_msg: "PASSED: NAS hostname matches expected configuration."
        fail_msg: "FAILED: Unexpected NAS hostname. Refusing deployment."

    ########################################
    # Directories
    ########################################
    - name: Create required directories
      file:
        path: "{{ item }}"
        state: directory
        owner: rex
        group: users
        mode: "0755"
      loop:
        - /home/rex/bin
        - /home/rex/logs/rsync-push

    ########################################
    # Deploy rsync-push
    ########################################
    - name: Deploy rsync-push
      copy:
        src: services/flashstor-sync/rsync-push
        dest: "{{ rsync_push_path }}"
        owner: rex
        group: users
        mode: "0755"
        validate: /bin/ash -n %s

    - name: Verify rsync-push executable
      command: "{{ rsync_push_path }} --help"
      changed_when: false
      when: not ansible_check_mode

    ########################################
    # Configure cron
    ########################################
    - name: Schedule rsync synchronization
      cron:
        name: NAS rsync push
        user: rex
        minute: "0"
        hour: "{{ sync_config.hour }}"
        job: "{{ sync_command }}"
        state: present

    ########################################
    # Verify cron
    ########################################
    - name: Read installed crontab
      command: crontab -u rex -l
      register: installed_crontab
      changed_when: false
      when: not ansible_check_mode

    - name: Verify cron configuration
      assert:
        that:
          - sync_cron in installed_crontab.stdout_lines
        success_msg: "PASSED: rsync synchronization cron job verified."
        fail_msg: "FAILED: Expected cron entry was not found."
      when: not ansible_check_mode

    ########################################
    # Summary
    ########################################
    - name: Show deployment summary
      debug:
        msg:
          - "Host      : {{ inventory_hostname }}"
          - "Script    : {{ rsync_push_path }}"
          - "Cron      : {{ sync_cron }}"
      when: not ansible_check_mode
