
---
- name: Set up LACP on MS-01
  hosts: ms01
  become: true

  tasks:
    - name: Configure LACP bond
      copy:
        dest: /etc/netplan/01-ms01-lacp.yaml
        owner: root
        group: root
        mode: "0600"
        backup: true
        content: |
          network:
            version: 2
            renderer: NetworkManager

            ethernets:
              enp3s0f0np0:
                dhcp4: false
                dhcp6: false

              enp3s0f1np1:
                dhcp4: false
                dhcp6: false

            bonds:
              bond0:
                interfaces:
                  - enp3s0f0np0
                  - enp3s0f1np1

                macaddress: "58:47:ca:7a:94:02"

                dhcp4: true
                dhcp6: true

                parameters:
                  mode: 802.3ad
                  lacp-rate: fast
                  mii-monitor-interval: 100
                  transmit-hash-policy: layer3+4
      notify: Apply Netplan

    - name: Validate Netplan
      command: netplan generate
      changed_when: false
      when: not ansible_check_mode

    - name: Apply pending network changes
      meta: flush_handlers
      when: not ansible_check_mode

    - name: Verify LACP aggregation
      command: cat /sys/class/net/bond0/bonding/ad_num_ports
      register: lacp_ports
      changed_when: false
      until: lacp_ports.rc == 0 and lacp_ports.stdout | trim == "2"
      retries: 5
      delay: 3
      when: not ansible_check_mode

  handlers:
    - name: Apply Netplan
      command: netplan apply
