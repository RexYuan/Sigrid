
---
- name: Set up Blocky on MS-01
  hosts: ms01

  vars_files:
    - common.yml

  vars:
    blocky_dir: /home/rex/homelab/blocky
    blocky_version: "v0.35.0"

  tasks:
    - name: Create Blocky directory
      file:
        path: "{{ blocky_dir }}"
        state: directory
        owner: rex
        group: rex
        mode: "0755"

    - name: Configure Blocky
      copy:
        dest: "{{ blocky_dir }}/config.yml"
        owner: rex
        group: rex
        mode: "0644"
        content: |
          upstreams:
            groups:
              default:
                - 1.1.1.1
                - 9.9.9.9

          blocking:
            denylists:
              ads:
                - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts

            clientGroupsBlock:
              default:
                - ads

          customDNS:
            zone: |
              $ORIGIN .
              $TTL 300

              ; LAN machines
              router.{{ lan_domain }}.     300 IN A {{ router_ip }}
              switch.{{ lan_domain }}.     300 IN A {{ switch_ip }}
              ms01.{{ lan_domain }}.       300 IN A {{ ms01_ip }}
              faex1.{{ lan_domain }}.      300 IN A {{ faex1_ip }}
              flashstor.{{ lan_domain }}.  300 IN A {{ flashstor_ip }}
              mba.{{ lan_domain }}.        300 IN A {{ mba_ip }}
              glkvm.{{ lan_domain }}.      300 IN A {{ glkvm_ip }}
              jetkvm.{{ lan_domain }}.     300 IN A {{ jetkvm_ip }}
              jetkvm2.{{ lan_domain }}.    300 IN A {{ jetkvm2_ip }}

              ; Tailscale machines
              ms01.{{ tailscale_domain }}. 300 IN A {{ ms01_tailscale_ip }}
              faex1.{{ tailscale_domain }}. 300 IN A {{ faex1_tailscale_ip }}

              ; LAN reverse proxy
              proxy.{{ service_domain }}. 300 IN A {{ reverse_proxy_ip }}

              ; LAN services
              temps.{{ service_domain }}. 300 IN CNAME proxy.{{ service_domain }}.
              webui.{{ service_domain }}. 300 IN CNAME proxy.{{ service_domain }}.
              share.{{ service_domain }}. 300 IN CNAME proxy.{{ service_domain }}.
              adm.{{ service_domain }}. 300 IN CNAME proxy.{{ service_domain }}.

              ; LAN Glances
              ms01.glances.{{ service_domain }}. 300 IN CNAME proxy.{{ service_domain }}.
              faex1.glances.{{ service_domain }}. 300 IN CNAME proxy.{{ service_domain }}.
              flashstor.glances.{{ service_domain }}. 300 IN CNAME proxy.{{ service_domain }}.

              ; Tailscale reverse proxy
              proxy.{{ service_domain }}.{{ tailscale_domain }}. 300 IN A {{ ms01_tailscale_ip }}

              ; Tailscale services
              temps.{{ service_domain }}.{{ tailscale_domain }}. 300 IN CNAME proxy.{{ service_domain }}.{{ tailscale_domain }}.
              webui.{{ service_domain }}.{{ tailscale_domain }}. 300 IN CNAME proxy.{{ service_domain }}.{{ tailscale_domain }}.
              share.{{ service_domain }}.{{ tailscale_domain }}. 300 IN CNAME proxy.{{ service_domain }}.{{ tailscale_domain }}.
              adm.{{ service_domain }}.{{ tailscale_domain }}. 300 IN CNAME proxy.{{ service_domain }}.{{ tailscale_domain }}.
              adm-offsite.{{ service_domain }}.{{ tailscale_domain }}. 300 IN CNAME proxy.{{ service_domain }}.{{ tailscale_domain }}.

              ; Tailscale Glances
              ms01.glances.{{ service_domain }}.{{ tailscale_domain }}. 300 IN CNAME proxy.{{ service_domain }}.{{ tailscale_domain }}.
              faex.glances.{{ service_domain }}.{{ tailscale_domain }}. 300 IN CNAME proxy.{{ service_domain }}.{{ tailscale_domain }}.
              flashstor.glances.{{ service_domain }}.{{ tailscale_domain }}. 300 IN CNAME proxy.{{ service_domain }}.{{ tailscale_domain }}.

          ports:
            dns:
              - "{{ ms01_ip }}:53"
              - "{{ ms01_tailscale_ip }}:53"
            freeBind: true
      register: blocky_config

    - name: Deploy Blocky
      community.docker.docker_container:
        name: blocky
        image: "spx01/blocky:{{ blocky_version }}"
        state: started
        restart_policy: unless-stopped
        pull: missing
        recreate: "{{ blocky_config.changed }}"
        network_mode: host

        env:
          TZ: Asia/Taipei

        volumes:
          - "{{ blocky_dir }}/config.yml:/app/config.yml:ro"
