
---
- name: Set up Blocky on MS-01
  hosts: ms01
  become: true

  vars_files:
    - common.yml

  vars:
    blocky_dir: /home/rex/homelab/blocky
    blocky_version: "v0.35.0"

  tasks:
    - name: Create Blocky directory
      ansible.builtin.file:
        path: "{{ blocky_dir }}"
        state: directory
        owner: rex
        group: rex
        mode: "0755"


    - name: Configure Blocky
      ansible.builtin.copy:
        dest: "{{ blocky_dir }}/config.yml"
        owner: rex
        group: rex
        mode: "0644"
        content: |
          upstreams:
            groups:
              default:
                - 1.1.1.1
                - 9.9.9.9

          blocking:
            denylists:
              ads:
                - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts

            clientGroupsBlock:
              default:
                - ads

          customDNS:
            zone: |
              $ORIGIN {{ home_domain }}.
              $TTL 300

              ; Machines
              router     300 IN A {{ router_ip }}
              switch     300 IN A {{ switch_ip }}
              ms01       300 IN A {{ ms01_ip }}
              faex1      300 IN A {{ faex1_ip }}
              flashstor   300 IN A {{ flashstor_ip }}
              mba        300 IN A {{ mba_ip }}
              glkvm      300 IN A {{ glkvm_ip }}
              jetkvm     300 IN A {{ jetkvm_ip }}
              jetkvm2    300 IN A {{ jetkvm2_ip }}

              ; Reverse proxy
              proxy      300 IN A {{ reverse_proxy_ip }}

              ; Services
              temps.svc   300 IN CNAME proxy.{{ home_domain }}.
              webui.svc   300 IN CNAME proxy.{{ home_domain }}.

          ports:
            dns: 53
      register: blocky_config

    - name: Create Docker Compose configuration
      ansible.builtin.copy:
        dest: "{{ blocky_dir }}/compose.yaml"
        owner: rex
        group: rex
        mode: "0644"
        content: |
          services:
            blocky:
              image: spx01/blocky:{{ blocky_version }}
              container_name: blocky
              restart: unless-stopped

              environment:
                TZ: Asia/Taipei

              ports:
                - "{{ ms01_ip }}:53:53/tcp"
                - "{{ ms01_ip }}:53:53/udp"

              volumes:
                - ./config.yml:/app/config.yml:ro

    - name: Deploy Blocky
      community.docker.docker_compose_v2:
        project_src: "{{ blocky_dir }}"
        state: present
        pull: missing
        recreate: "{{ 'always' if blocky_config.changed else 'auto' }}"
