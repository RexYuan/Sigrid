
---
- name: Deploy temperature monitors to MS-01, FAEX1, and Flashstor
  hosts: ms01,faex1,flashstor
  gather_facts: false

  vars:
    temps_target: "{{ (group_names | intersect(['ms01', 'faex1', 'flashstor'])) | first }}"
    temps_dir: "{{ '/volume1/home/rex/bin' if temps_target == 'flashstor' else '/home/rex/bin' }}"
    temps_scripts:
      ms01: |
        #!/usr/bin/env bash
        # Smooth ncurses temperature monitor for the Minisforum MS-01.
        # A self-contained Bash launcher + Python 3 (standard-library curses) program.
        # No root access, sensors-detect, watch, or pip packages required.
        set -euo pipefail
        if [[ ! -t 0 || ! -t 1 ]]; then
            echo 'temps.sh requires an interactive terminal (local or SSH).' >&2
            exit 1
        fi
        if ! command -v python3 >/dev/null 2>&1; then
            echo 'Python 3 is required: sudo apt install python3' >&2
            exit 1
        fi
        if [[ ${TERM:-dumb} == dumb ]]; then
            echo 'A terminal with ncurses support is required (TERM is dumb).' >&2
            exit 1
        fi
        # Feed embedded Python to "cat", not to Python's stdin: keyboard input remains
        # attached to the SSH terminal, allowing curses to handle keys and resize events.
        exec python3 -c "$(cat <<'PYTHON'
        import curses
        import datetime
        import glob
        import math
        import os
        from pathlib import Path
        import re
        import subprocess
        import sys
        import time

        def interval_argument(argv):
            if len(argv) > 2 or (len(argv) == 2 and argv[1] in ('-h', '--help')):
                print('Usage: temps.sh [refresh_seconds]', file=sys.stderr)
                raise SystemExit(0 if len(argv) == 2 and argv[1] in ('-h', '--help') else 2)
            try:
                interval = float(argv[1]) if len(argv) == 2 else 1.0
            except ValueError:
                interval = float('nan')
            if not math.isfinite(interval) or not 0.1 <= interval <= 60:
                print('Refresh interval must be between 0.1 and 60 seconds.', file=sys.stderr)
                raise SystemExit(2)
            return interval

        def read(path):
            try:
                return Path(path).read_text().strip()
            except (OSError, UnicodeError):
                return None

        def temp(path):
            value = read(path)
            try:
                return int(value) / 1000 if value is not None else None
            except ValueError:
                return None

        def c(value):
            return f'{value:.1f}°C' if value is not None else 'N/A'

        TEMP_RE = re.compile(r'\d+(?:\.\d+)?°C')

        def temperature_limits(line):
            label = line.lstrip()

            if label.startswith('Package:'):
                return 80, 95

            if label.startswith(('GPU core:', 'Core:')):
                return 75, 85

            if label.startswith('Sensor 2'):
                return 70, 80

            if label.startswith(('Composite', 'Sensor ')):
                return 60, 70

            return None

        def hwmon():
            devices = []
            for p in sorted(glob.glob('/sys/class/hwmon/hwmon*')):
                name = read(Path(p) / 'name')
                if name:
                    devices.append((Path(p), name))
            return devices

        def cpu_readings(devices):
            package = None
            cores = []
            for hw, name in devices:
                if name != 'coretemp':
                    continue
                for inp in hw.glob('temp*_input'):
                    number = inp.stem[4:-6]
                    if not number.isdigit():
                        continue
                    label = read(hw / f'temp{number}_label') or f'CPU sensor {number}'
                    val = temp(inp)
                    if val is None:
                        continue
                    if label.startswith('Package'):
                        package = val if package is None else max(package, val)
                    elif label.startswith('Core '):
                        try:
                            core_no = int(label.split()[1])
                            cores.append((core_no, label, val))
                        except (ValueError, IndexError):
                            pass
            cores.sort(key=lambda x: x[0])
            hottest = max((v for _, _, v in cores), default=None)
            return package, hottest, cores

        def gpu_reading():
            try:
                result = subprocess.run(
                    ['nvidia-smi', '--query-gpu=temperature.gpu', '--format=csv,noheader,nounits'],
                    capture_output=True, text=True, timeout=2, check=True,
                )
            except (FileNotFoundError, subprocess.SubprocessError, OSError):
                return None
            try:
                return float(result.stdout.strip().splitlines()[0].strip())
            except (IndexError, ValueError):
                return None

        def nvme_readings(devices):
            drives = []
            for hw, name in devices:
                if name != 'nvme':
                    continue
                model = read(hw / 'device/model') or read(hw / 'device/device/model') or ''
                if 'PM9A3' in model.upper() or 'MZQL2' in model.upper():
                    display = 'Samsung PM9A3 15.36 TB'
                    is_pm9a3 = True
                else:
                    display = model or 'NVMe SSD'
                    is_pm9a3 = False
                measurements = []
                for inp in hw.glob('temp*_input'):
                    number = inp.stem[4:-6]
                    if not number.isdigit():
                        continue
                    val = temp(inp)
                    if val is None:
                        continue
                    label = read(hw / f'temp{number}_label') or f'Sensor {number}'
                    if label.lower() == 'composite':
                        priority, label = 0, 'Composite'
                    elif label == 'Sensor 1' and is_pm9a3:
                        priority, label = 1, 'Sensor 1'
                    elif label == 'Sensor 2' and is_pm9a3:
                        priority, label = 2, 'Sensor 2'
                    else:
                        priority = 20 + int(number)
                    measurements.append((priority, label, val))
                measurements.sort()
                drives.append((display, measurements))
            return drives

        # Lines contain a (text, style) pair. Only altered lines are sent to the screen.
        def build_lines(width, interval):
            devices = hwmon()
            package, hottest, cores = cpu_readings(devices)
            nvmes = nvme_readings(devices)
            gpu = gpu_reading()
            now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')

            result = []
            def add(text='', style=0):
                result.append((text, style))

            add(f'MS-01  •  LIVE TEMPERATURES     {now}', 1)
            add('─' * max(0, width - 1), 2)
            add('CPU  |  Intel Core i9-13900H', 3)
            add(f'  Package: {c(package):>9}      Hottest core: {c(hottest):>9}')
            add()
            add('GPU  |  NVIDIA RTX 2000E Ada', 3)
            add(f'  GPU core: {c(gpu):>9}' if gpu is not None else '  NVIDIA temperature unavailable (check nvidia-smi)', 0 if gpu is not None else 4)
            add()
            if nvmes:
                for idx, (model, measurements) in enumerate(nvmes, 1):
                    add(f'SSD {idx}  |  {model}', 3)
                    if not measurements:
                        add('  NVMe temperature sensors unavailable', 4)
                    for _, label, value in measurements:
                        add(f'  {label:<25} {c(value):>9}')
                    add()
            else:
                add('SSD  |  No NVMe hwmon temperature sensors found', 4)
                add()
            add('─' * max(0, width - 1), 2)
            add(f'q / Ctrl+C: quit    +/-: interval    Refresh: {interval:g}s', 2)
            return result

        def tui(stdscr, interval):
            try:
                curses.curs_set(0)
            except curses.error:
                pass
            stdscr.keypad(True)
            stdscr.timeout(100)
            colors = {0: curses.A_NORMAL, 1: curses.A_BOLD, 2: curses.A_DIM,
                      3: curses.A_BOLD, 4: curses.A_DIM}
            if curses.has_colors():
                curses.start_color()
                try:
                    curses.use_default_colors()
                except curses.error:
                    pass
                curses.init_pair(1, curses.COLOR_CYAN, -1)
                curses.init_pair(2, curses.COLOR_YELLOW, -1)
                curses.init_pair(3, curses.COLOR_GREEN, -1)
                curses.init_pair(4, curses.COLOR_YELLOW, -1)
                curses.init_pair(5, curses.COLOR_RED, -1)
                colors[1] = curses.A_BOLD | curses.color_pair(1)
                colors[3] = curses.A_BOLD | curses.color_pair(1)
                colors[4] = curses.color_pair(2)

            prev = []
            next_read = 0.0
            prior_size = (0, 0)
            while True:
                now = time.monotonic()
                height, width = stdscr.getmaxyx()
                if (height, width) != prior_size:
                    # Only initialize/clear when the *terminal dimensions* change.
                    # Routine refreshes never clear the screen.
                    stdscr.erase()
                    prev = []
                    prior_size = (height, width)
                    next_read = 0.0
                if now >= next_read:
                    lines = build_lines(width, interval)
                    available = max(0, height - 1)
                    if len(lines) > available:
                        # Keep vital CPU/GPU/SSD data visible on small SSH windows.
                        # A one-line hint explains the display limit.
                        lines = lines[:max(0, available - 1)] + [
                            ('Terminal too short to show all sensors; enlarge window.', 4)
                        ]
                    for y in range(min(available, max(len(prev), len(lines)))):
                        item = lines[y] if y < len(lines) else ('', 0)
                        if y < len(prev) and prev[y] == item:
                            continue
                        text, style = item
                        try:
                            stdscr.move(y, 0)
                            stdscr.clrtoeol()
                            if text and width > 1:
                                stdscr.addnstr(y, 0, text, width - 1, colors[style])

                                # Color temperature values only.
                                limits = temperature_limits(text)

                                if limits is not None:
                                    warn, critical = limits

                                    for match in TEMP_RE.finditer(text):
                                        x = match.start()

                                        if x >= width - 1:
                                            break

                                        value = float(match.group()[:-2])

                                        pair = (
                                            5 if value >= critical else
                                            4 if value >= warn else
                                            3
                                        )

                                        stdscr.addnstr(
                                            y,
                                            x,
                                            match.group(),
                                            width - 1 - x,
                                            curses.color_pair(pair)
                                        )
                        except curses.error:
                            pass
                    stdscr.noutrefresh()
                    curses.doupdate()    # ncurses applies only changed cells, no flash
                    prev = lines
                    next_read = time.monotonic() + interval
                ch = stdscr.getch()
                if ch in (ord('q'), ord('Q'), 27):
                    return
                if ch in (ord('+'), ord('=')):
                    interval = max(0.1, round(interval / 2, 2))
                    next_read = 0
                elif ch in (ord('-'), ord('_')):
                    interval = min(60.0, round(interval * 2, 2))
                    next_read = 0
                elif ch == curses.KEY_RESIZE:
                    prior_size = (0, 0)

        if __name__ == '__main__':
            seconds = interval_argument(sys.argv)
            try:
                curses.wrapper(tui, seconds)
            except KeyboardInterrupt:
                pass
            except curses.error as exc:
                print(f'Cannot initialize the ncurses display: {exc}', file=sys.stderr)
                raise SystemExit(1)
        PYTHON
        )" "$@"
      faex1: |
        #!/usr/bin/env bash
        # FAEX1 live temperature monitor
        # AMD Ryzen AI Max+ 395 / Radeon 8060S
        # Smooth ncurses display, suitable for SSH.
        # Requirements: Bash, Python 3 (standard library only).

        set -euo pipefail

        if [[ ! -t 0 || ! -t 1 ]]; then
            echo "An interactive terminal is required." >&2
            exit 1
        fi

        if ! command -v python3 >/dev/null 2>&1; then
            echo "Python 3 is required." >&2
            exit 1
        fi

        if [[ ${TERM:-dumb} == dumb ]]; then
            echo "A terminal with ncurses support is required." >&2
            exit 1
        fi

        # Python source is passed as an argument so stdin remains
        # attached to the terminal for keyboard interaction.

        exec python3 -c "$(cat <<'PYTHON'
        import curses
        import datetime
        import glob
        import math
        import os
        from pathlib import Path
        import re
        import struct
        import sys
        import time

        # ------------------------------------------------------------
        # Configuration
        # ------------------------------------------------------------

        KNOWN_SSDS = [
            (
                "S73WNU0XA42784A",
                "Samsung 990 PRO 2 TB — Ubuntu"
            ),
            (
                "S73WNU0XA42780L",
                "Samsung 990 PRO 2 TB — Windows"
            ),
            (
                "PHAL1274000Z1P6EGN",
                "Intel Optane P5800X 1.6 TB — Data"
            ),
        ]

        # ------------------------------------------------------------
        # Utilities
        # ------------------------------------------------------------

        def interval_argument(argv):
            if len(argv) == 2 and argv[1] in ("-h", "--help"):
                print("Usage: temps.sh [refresh_seconds]")
                raise SystemExit(0)

            if len(argv) > 2:
                print("Usage: temps.sh [refresh_seconds]", file=sys.stderr)
                raise SystemExit(2)

            try:
                interval = float(argv[1]) if len(argv) == 2 else 1.0
            except ValueError:
                interval = float("nan")

            if not math.isfinite(interval) or not 0.1 <= interval <= 60:
                print("Refresh must be between 0.1 and 60 seconds.", file=sys.stderr)
                raise SystemExit(2)

            return interval

        def read(path):
            try:
                return Path(path).read_text().strip()
            except (OSError, UnicodeError):
                return None

        def temperature(path):
            value = read(path)

            try:
                return int(value) / 1000 if value is not None else None
            except ValueError:
                return None

        def fmt(value):
            return f"{value:.1f}°C" if value is not None else "N/A"

        # ------------------------------------------------------------
        # Hardware monitoring
        # ------------------------------------------------------------

        TEMP_RE = re.compile(r'\d+(?:\.\d+)?°C')

        def temperature_limits(line):
            label = line.lstrip()

            if label.startswith(("Tctl:", "CPU Tctl:")):
                return 80, 95

            if label.startswith(("Edge:", "GPU edge:")):
                return 75, 85

            if label.startswith("Sensor 2"):
                return 70, 80

            if label.startswith(("Composite", "Sensor ")):
                return 60, 70

            return None

        def hwmon_devices():
            devices = []

            for p in sorted(glob.glob("/sys/class/hwmon/hwmon*")):
                name = read(Path(p) / "name")

                if name:
                    devices.append((Path(p), name))

            return devices

        def sensors_for(hw):
            result = []

            for inp in hw.glob("temp*_input"):
                number = inp.stem[4:-6]

                if not number.isdigit():
                    continue

                value = temperature(inp)

                if value is None:
                    continue

                label = (
                    read(hw / f"temp{number}_label")
                    or f"Sensor {number}"
                )

                if label.lower() == "composite":
                    order = 0
                    label = "Composite"
                elif label.startswith("Sensor "):
                    order = int(number)
                else:
                    order = int(number) + 20

                result.append((order, label, value))

            return sorted(result)

        def temperature_for(devices, driver_name, label):
            for hw, driver in devices:
                if driver != driver_name:
                    continue

                for _, sensor_label, value in sensors_for(hw):
                    if sensor_label == label:
                        return value

            return None

        # ------------------------------------------------------------
        # AMD GPU Metrics v3.0
        # ------------------------------------------------------------

        def gpu_metrics():
            # AMD GPU Metrics 3.0:
            # 0-3: structure header
            # 4-5: GPU temperature (centi-Celsius)
            # 6-7: SoC temperature (centi-Celsius)

            for card in sorted(Path("/sys/class/drm").glob("card[0-9]*")):
                dev = card / "device"

                if read(dev / "vendor") != "0x1002":
                    continue

                try:
                    data = (dev / "gpu_metrics").read_bytes()

                    if len(data) < 8:
                        continue

                    size, major, minor = struct.unpack_from(
                        "<HBB", data
                    )

                    if (major, minor) != (3, 0):
                        continue

                    if not 8 <= size <= len(data):
                        continue

                    gfx, soc = struct.unpack_from("<HH", data, 4)

                    def convert(raw):
                        if raw in (0, 65535):
                            return None
                        return raw / 100

                    return convert(gfx), convert(soc)

                except (OSError, ValueError, struct.error):
                    continue

            return None, None

        def cpu_gpu_readings(devices):
            cpu = temperature_for(devices, "k10temp", "Tctl")
            gpu = temperature_for(devices, "amdgpu", "edge")

            gfx_metrics, soc = gpu_metrics()

            if gpu is None:
                gpu = gfx_metrics

            return cpu, gpu, soc

        # ------------------------------------------------------------
        # NVMe SSD identification by serial number
        # ------------------------------------------------------------

        def nvme_readings(devices):
            hw_nvmes = [
                (hw.resolve(), hw)
                for hw, driver in devices
                if driver == "nvme"
            ]

            by_serial = {}

            for controller in sorted(
                Path("/sys/class/nvme").glob("nvme[0-9]*")
            ):
                if not re.fullmatch(r"nvme\d+", controller.name):
                    continue

                serial = read(controller / "serial")

                if not serial:
                    continue

                canonical = str(controller.resolve())

                matches = []

                for resolved, hw in hw_nvmes:
                    if str(resolved).startswith(canonical + os.sep):
                        matches.append(hw)

                if not matches:
                    # Fallback: identify hardware by PCI address.
                    pci_path = str((controller / "device").resolve())

                    pci_bdf = next(
                        (
                            part
                            for part in reversed(pci_path.split(os.sep))
                            if re.fullmatch(
                                r"[0-9a-f]{4}:[0-9a-f]{2}:"
                                r"[0-9a-f]{2}\.[0-7]",
                                part
                            )
                        ),
                        None
                    )

                    if pci_bdf:
                        matches = [
                            hw
                            for resolved, hw in hw_nvmes
                            if pci_bdf in str(resolved)
                        ]

                readings = sensors_for(matches[0]) if matches else []

                by_serial[serial] = (
                    controller.name,
                    readings
                )

            result = []

            for serial, display in KNOWN_SSDS:
                found = by_serial.get(serial)

                if found:
                    device, readings = found

                    result.append((
                        f"{display} [{device}]",
                        readings,
                        None
                    ))
                else:
                    result.append((
                        display,
                        [],
                        "Drive not detected"
                    ))

            return result

        # ------------------------------------------------------------
        # Dashboard construction
        # ------------------------------------------------------------

        def build_lines(width, interval):
            devices = hwmon_devices()

            cpu, gpu, soc = cpu_gpu_readings(devices)
            drives = nvme_readings(devices)

            now = datetime.datetime.now().strftime(
                "%Y-%m-%d %H:%M:%S"
            )

            lines = []

            def add(message="", style=0):
                lines.append((message, style))

            add(f"FAEX1  •  LIVE TEMPERATURES     {now}", 1)
            add("─" * max(0, width - 1), 2)

            # CPU and SoC
            add("CPU  |  AMD Ryzen AI Max+ 395", 3)
            add(
                f"  Tctl: {fmt(cpu):>9}"
                f"      SoC: {fmt(soc):>9}"
            )
            add()

            # Integrated GPU
            add("GPU  |  AMD Radeon 8060S", 3)
            add(f"  Edge: {fmt(gpu):>9}")
            add()

            # SSDs
            for index, (display, measurements, error) in enumerate(
                drives, 1
            ):
                add(f"SSD {index}  |  {display}", 3)

                if error:
                    add(f"  {error}", 4)

                elif not measurements:
                    add("  Temperature sensors unavailable", 4)

                else:
                    for _, label, value in measurements:
                        add(
                            f"  {label:<25}"
                            f" {fmt(value):>9}"
                        )

                add()

            add("─" * max(0, width - 1), 2)

            add(
                "q / Ctrl+C: quit    "
                "+/-: interval    "
                f"Refresh: {interval:g}s",
                2
            )

            return lines

        # ------------------------------------------------------------
        # Smooth ncurses interface
        # ------------------------------------------------------------

        def tui(stdscr, interval):
            try:
                curses.curs_set(0)
            except curses.error:
                pass

            stdscr.keypad(True)
            stdscr.timeout(100)

            colors = {
                0: curses.A_NORMAL,
                1: curses.A_BOLD,
                2: curses.A_DIM,
                3: curses.A_BOLD,
                4: curses.A_DIM,
            }

            if curses.has_colors():
                curses.start_color()

                try:
                    curses.use_default_colors()
                except curses.error:
                    pass

                curses.init_pair(1, curses.COLOR_CYAN, -1)
                curses.init_pair(2, curses.COLOR_YELLOW, -1)
                curses.init_pair(3, curses.COLOR_GREEN, -1)
                curses.init_pair(4, curses.COLOR_YELLOW, -1)
                curses.init_pair(5, curses.COLOR_RED, -1)

                colors[1] = (
                    curses.A_BOLD | curses.color_pair(1)
                )
                colors[3] = (
                    curses.A_BOLD | curses.color_pair(1)
                )
                colors[4] = curses.color_pair(2)

            previous = []
            next_read = 0.0
            previous_size = (0, 0)

            while True:
                now = time.monotonic()
                height, width = stdscr.getmaxyx()

                if (height, width) != previous_size:
                    # Clear only when terminal dimensions change.
                    # Normal refreshes never clear the screen.
                    stdscr.erase()

                    previous = []
                    previous_size = (height, width)
                    next_read = 0.0

                if now >= next_read:
                    lines = build_lines(width, interval)
                    available = max(0, height - 1)

                    if len(lines) > available:
                        lines = lines[:max(0, available - 1)] + [
                            (
                                "Terminal too short; enlarge window.",
                                4
                            )
                        ]

                    for y in range(
                        min(
                            available,
                            max(len(previous), len(lines))
                        )
                    ):
                        item = (
                            lines[y]
                            if y < len(lines)
                            else ("", 0)
                        )

                        if (
                            y < len(previous)
                            and previous[y] == item
                        ):
                            continue

                        text, style = item

                        try:
                            stdscr.move(y, 0)
                            stdscr.clrtoeol()

                            if text and width > 1:
                                stdscr.addnstr(
                                    y,
                                    0,
                                    text,
                                    width - 1,
                                    colors[style]
                                )

                                if curses.has_colors():
                                    limits = temperature_limits(text)

                                    if limits is not None:
                                        warn, critical = limits

                                        for match in TEMP_RE.finditer(text):
                                            x = match.start()

                                            if x >= width - 1:
                                                break

                                            value = float(match.group()[:-2])

                                            pair = (
                                                5 if value >= critical else
                                                4 if value >= warn else
                                                3
                                            )

                                            stdscr.addnstr(
                                                y,
                                                x,
                                                match.group(),
                                                width - 1 - x,
                                                curses.color_pair(pair)
                                            )

                        except curses.error:
                            pass

                    # Refresh only changed terminal cells.
                    stdscr.noutrefresh()
                    curses.doupdate()

                    previous = lines
                    next_read = time.monotonic() + interval

                ch = stdscr.getch()

                if ch in (ord("q"), ord("Q"), 27):
                    return

                if ch in (ord("+"), ord("=")):
                    interval = max(
                        0.1, round(interval / 2, 2)
                    )
                    next_read = 0

                elif ch in (ord("-"), ord("_")):
                    interval = min(
                        60.0, round(interval * 2, 2)
                    )
                    next_read = 0

                elif ch == curses.KEY_RESIZE:
                    previous_size = (0, 0)

        # ------------------------------------------------------------
        # Entry point
        # ------------------------------------------------------------

        if __name__ == "__main__":
            seconds = interval_argument(sys.argv)

            try:
                curses.wrapper(tui, seconds)

            except KeyboardInterrupt:
                pass

            except curses.error as exc:
                print(
                    f"Cannot initialize ncurses: {exc}",
                    file=sys.stderr
                )
                raise SystemExit(1)
        PYTHON
        )" "$@"
      flashstor: |
        #!/bin/sh
        # FS6712X live temperatures. BusyBox sh + awk + sensors.
        # Usage: temps [1-60] | temps --once
        set -u
        INTERVAL=${1:-1}
        ONCE=0
        if [ "$INTERVAL" = '--once' ]; then
            ONCE=1
            INTERVAL=2
        fi
        case "$INTERVAL" in
            ''|*[!0-9]*|0)
                echo 'Usage: temps [1-60] | temps --once' >&2
                exit 2 ;;
        esac
        [ "$INTERVAL" -le 60 ] || exit 2
        command -v sensors >/dev/null 2>&1 || exit 1
        command -v awk >/dev/null 2>&1 || exit 1
        # PCI address -> Linux NVMe device (not ADM bay number).
        MAP=$(
            for ctl in /sys/class/nvme/nvme[0-9]*; do
                [ -e "$ctl/device" ] || continue
                path=$(readlink -f "$ctl/device" 2>/dev/null) || continue
                pci=${path##*/}
                case "$pci" in
                    ????:??:??.?) ;;
                    *) continue ;;
                esac
                bus=${pci#*:}
                bus=${bus%%:*}
                dev=${pci#*:*:}
                dev=${dev%%.*}
                printf '%s %s\n' "$bus$dev" "${ctl##*/}"
            done
        )
        COLOR=0
        if [ -t 1 ] &&
           [ -z "${NO_COLOR:-}" ] &&
           [ "${TERM:-dumb}" != dumb ]; then
            COLOR=1
        fi
        render() {
            sensors | awk \
                -v mapping="$MAP" \
                -v color="$COLOR" \
                -v now="$(date '+%Y-%m-%d %H:%M:%S')" \
                -v interval="$INTERVAL" '
            BEGIN {
                count=split(mapping, entries, "\n")
                for(i=1; i<=count; i++) {
                    split(entries[i], p, /[ \t]+/)
                    if(p[1]!="" && p[2]!="")
                        devmap[p[1]]=p[2]
                }
                green=sprintf("%c[32m",27)
                yellow=sprintf("%c[33m",27)
                red=sprintf("%c[31m",27)
                reset=sprintf("%c[0m",27)
                sep="────────────────────────────────────────────────────────────────────────────────────────────"
            }
            function value(line) {
                sub(/^[^:]*:/,"",line)
                sub(/^[ \t]*/,"",line)
                return line+0
            }
            function temp(x,warn,critical, t,c) {
                if(x=="") return "   N/A "
                t=sprintf("%5.1f°C",x)
                if(!color) return t
                c=(x>=critical ? red : (x>=warn ? yellow : green))
                return c t reset
            }
            /^nvme-pci-[0-9a-f]+$/ {
                kind="nvme"
                id=substr($1,10)
                seen[id]=1
                next
            }
            /^coretemp-isa-/ { kind="cpu"; next }
            /^[[:alnum:]_-]+-(pci|isa|acpi)-[[:alnum:]_-]+$/ {
                kind="other"
                next
            }
            kind=="cpu" && /^Package id 0:/ {
                package=value($0)
                have_cpu=1
                next
            }
            kind=="cpu" && /^Core [0-9]+:/ {
                x=value($0)
                if(!have_core || x>core_max) core_max=x
                have_core=1
                next
            }
            kind=="nvme" && /^Composite:/ {
                comp[id]=value($0)
                next
            }
            kind=="nvme" && /^Sensor 1:/ {
                sensor1[id]=value($0)
                next
            }
            kind=="nvme" && /^Sensor 2:/ {
                sensor2[id]=value($0)
                next
            }
            END {
                print "FLASHSTOR 12 PRO  •  LIVE TEMPERATURES     " now
                print sep
                print "CPU  |  Intel Celeron N5105"
                printf "  Package: %s",
                    (have_cpu ? temp(package,80,95) : "N/A")
                if(have_core)
                    printf "      Hottest core: %s",
                        temp(core_max,80,95)
                printf "\n\n"
                n=0
                for(k in seen) keys[++n]=k
                for(i=1;i<=n;i++)
                    for(j=i+1;j<=n;j++)
                        if(keys[j]<keys[i]) {
                            tmp=keys[i]
                            keys[i]=keys[j]
                            keys[j]=tmp
                        }
                printf "SSD  |  %d × Crucial P3 Plus 4 TB (PCI order, not ADM bay order)\n",n
                printf "  %-10s %-10s    %-9s     %-8s     %-8s\n",
                    "PCI","Linux dev","Composite","Sensor 1","Sensor 2"
                for(i=1;i<=n;i++) {
                    k=keys[i]
                    address=substr(k,1,2) ":" substr(k,3,2) ".0"
                    dev=(devmap[k]!="" ? devmap[k] : "--")
                    printf "  %-10s %-10s    %s       %s      %s\n",
                        address,dev,
                        temp(comp[k],60,70),
                        temp(sensor1[k],60,70),
                        temp(sensor2[k],70,80)
                    if(comp[k]!="") {
                        sum+=comp[k]
                        available++
                        if(available==1 || comp[k]>max)
                            max=comp[k]
                        if(available==1 || comp[k]<min)
                            min=comp[k]
                    }
                }
                if(available)
                    printf "\n  Composite: min %s  |  avg %s  |  max %s\n",
                        temp(min,60,70),
                        temp(sum/available,60,70),
                        temp(max,60,70)
                if(n!=12)
                    print "  Note: Expected 12 SSDs; check sensors if a drive is missing."
                print sep
                print "q / Ctrl+C: quit    +/-: interval    Refresh: " interval "s"
            }'
        }
        if [ "$ONCE" -eq 1 ] ||
           [ ! -t 0 ] ||
           [ ! -t 1 ]; then
            render
            exit $?
        fi
        OLD_STTY=$(stty -g </dev/tty 2>/dev/null) || OLD_STTY=''
        restore() {
            [ -z "$OLD_STTY" ] ||
                stty "$OLD_STTY" </dev/tty 2>/dev/null
            printf '\033[?25h\n'
        }
        trap restore 0
        trap 'exit 0' 1 2 3 15
        if [ -n "$OLD_STTY" ]; then
            stty -echo -icanon min 0 time 0 \
                </dev/tty 2>/dev/null
        fi
        printf '\033[?25l\033[2J'
        while :; do
            FRAME=$(render)
            printf '\033[H\033[J%s\n' "$FRAME"
            sleep "$INTERVAL"
            if [ -n "$OLD_STTY" ]; then
                KEY=$(dd if=/dev/tty bs=1 count=1 2>/dev/null)
                case "$KEY" in
                    q|Q) break ;;
                    +)
                        [ "$INTERVAL" -le 1 ] ||
                            INTERVAL=$((INTERVAL-1)) ;;
                    -)
                        [ "$INTERVAL" -ge 60 ] ||
                            INTERVAL=$((INTERVAL+1)) ;;
                esac
            fi
        done

  tasks:
    - name: Ensure bin directory exists
      file:
        path: "{{ temps_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy temps
      copy:
        dest: "{{ temps_dir }}/temps"
        content: "{{ temps_scripts[temps_target] }}"
        mode: "0755"
