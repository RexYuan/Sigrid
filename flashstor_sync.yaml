
---
- name: Set up rsync synchronization on Flashstor
  hosts: flashstor,flashstor-offsite
  become: true
  gather_facts: false

  vars:
    rsync_push_path: /home/rex/bin/rsync-push

    sync_hosts:
      flashstor:
        hostname: FS6712X-251D
        namespace: Rex
        remote: ts-flashstor-offsite
        hour: "13"

      flashstor-offsite:
        hostname: FS6712X-87BC
        namespace: YingTing
        remote: ts-flashstor
        hour: "1"

    sync_config: "{{ sync_hosts[inventory_hostname] }}"

    sync_command: >-
      {{ rsync_push_path }} {{ sync_config.namespace }} {{ sync_config.remote }}

  tasks:
    - name: Identify NAS hostname
      command: uname -n
      register: nas_hostname
      changed_when: false
      check_mode: false

    - name: Validate NAS identity
      assert:
        that:
          - nas_hostname.stdout == sync_config.hostname
        success_msg: >-
          PASSED: {{ inventory_hostname }} ({{ nas_hostname.stdout }})
          will synchronize {{ sync_config.namespace }}
          to {{ sync_config.remote }} daily at
          {{ sync_config.hour }}:00.
        fail_msg: >-
          FAILED: Expected {{ sync_config.hostname }},
          detected {{ nas_hostname.stdout }}.
          Refusing deployment.

    - name: Create required directories
      file:
        path: "{{ item }}"
        state: directory
        owner: rex
        group: users
        mode: "0755"
      loop:
        - /home/rex/bin
        - /home/rex/logs/rsync-push

    - name: Deploy rsync-push
      copy:
        src: services/flashstor-sync/rsync-push
        dest: "{{ rsync_push_path }}"
        owner: rex
        group: users
        mode: "0755"
        validate: /bin/ash -n %s

    - name: Schedule rsync synchronization
      cron:
        name: NAS rsync push
        user: rex
        minute: "0"
        hour: "{{ sync_config.hour }}"
        job: "{{ sync_command }}"
        state: present
