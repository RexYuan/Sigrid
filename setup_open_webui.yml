
---
- name: Set up Open WebUI on FAEX1
  hosts: faex1

  vars_files:
    - common.yml
    - secret.yml

  vars:
    open_webui_dir: /home/rex/homelab/open-webui
    open_webui_version: "0.13.0"
    open_webui_url: http://127.0.0.1:3000

    open_webui_models: # compaction thresholds for models
      - { id: gemma-4-ortenzya-the-creative-wordsmith-31b-it-uncensored-heretic, threshold: 190000 }
      - { id: ggml-org/gemma-4-31b-it-gguf/gemma-4-31b-it-q8_0.gguf, threshold: 190000 }
      - { id: glm-4.7-flash, threshold: 145000 }
      - { id: glm-4.7-flash-uncensored-hauhaucs-aggressive, threshold: 145000 }
      - { id: l3.3-70b-euryale-v2.3, threshold: 95000 }
      - { id: mistralai_mistral-small-4-119b-2603, threshold: 550000 }
      - { id: gpt-oss-120b, threshold: 95000 }
      - { id: gpt-oss-20b, threshold: 95000 }
      - { id: qwen3-4b-instruct-2507, threshold: 190000 }
      - { id: qwen3.8-27b, threshold: 190000 }
      - { id: qwen3.8-27b-uncensored-hauhaucs-aggressive-mtp, threshold: 190000 }
      - { id: thedrummer_cydonia-24b-v4.2.0, threshold: 95000 }

    open_webui_hidden_models: # non-chat models
      - ggml-org/gemma-4-31b-it-gguf/mtp-gemma-4-31b-it-q8_0.gguf
      - text-embedding-nomic-embed-text-v1.5

    open_webui_public_models: # default is private
      - ggml-org/gemma-4-31b-it-gguf/gemma-4-31b-it-q8_0.gguf
      - glm-4.7-flash
      - mistralai_mistral-small-4-119b-2603
      - gpt-oss-120b
      - gpt-oss-20b
      - qwen3.8-27b

  tasks:
    - name: Create Open WebUI directory
      file:
        path: "{{ open_webui_dir }}/data"
        state: directory
        owner: rex
        group: rex
        mode: "0755"

    - name: Deploy Open WebUI
      community.docker.docker_container:
        name: faex1-open-webui
        image: "ghcr.io/open-webui/open-webui:v{{ open_webui_version }}-slim"
        state: started
        pull: missing
        restart_policy: unless-stopped
        network_mode: host

        env:
          TZ: Asia/Taipei
          HOST: "0.0.0.0"
          PORT: "3000"

          WEBUI_SECRET_KEY_FILE: "/app/backend/data/.webui_secret_key"
          WEBUI_AUTH: "True"
          ENABLE_SIGNUP: "False"
          DEFAULT_USER_ROLE: "pending"

          ENABLE_ADMIN_CHAT_ACCESS: "False"
          ENABLE_ADMIN_EXPORT: "False"
          ENABLE_COMMUNITY_SHARING: "False"
          ENABLE_OPENAI_API_PASSTHROUGH: "False"
          ENABLE_DIRECT_CONNECTIONS: "False"

          ENABLE_OLLAMA_API: "False"
          ENABLE_OPENAI_API: "True"
          OPENAI_API_BASE_URL: "http://127.0.0.1:1234/v1"
          OPENAI_API_KEY: "sk-no-key-required"

          ENABLE_CONTEXT_COMPACTION: "True"
          CONTEXT_COMPACTION_MODEL: ""
          CONTEXT_COMPACTION_TOKEN_THRESHOLD: "6000"
          CONTEXT_COMPACTION_TOKEN_CAP: "600000"
          CONTEXT_COMPACTION_RETENTION_PERCENTAGE: "40"

        volumes:
          - "{{ open_webui_dir }}/data:/app/backend/data"

        security_opts:
          - no-new-privileges:true

    - name: Wait for Open WebUI
      uri:
        url: "{{ open_webui_url }}/health"
        status_code: 200
      register: webui_health
      until: webui_health.status == 200
      retries: 30
      delay: 5
      changed_when: false

    - name: Sign in as administrator
      uri:
        url: "{{ open_webui_url }}/api/v1/auths/signin"
        method: POST
        body_format: json
        body:
          email: "{{ open_webui_admin_email }}"
          password: "{{ open_webui_admin_password }}"
        status_code: [200, 400]
      register: webui_signin
      changed_when: false
      no_log: true

    - name: Create initial administrator if necessary
      uri:
        url: "{{ open_webui_url }}/api/v1/auths/signup"
        method: POST
        body_format: json
        body:
          name: "{{ open_webui_admin_name | default('Admin') }}"
          email: "{{ open_webui_admin_email }}"
          password: "{{ open_webui_admin_password }}"
        status_code: 200
      register: webui_signup
      when: webui_signin.status == 400
      no_log: true

    - name: Set authentication token
      set_fact:
        webui_token: >-
          {{
            webui_signin.json.token
            if webui_signin.status == 200
            else webui_signup.json.token
          }}
      no_log: true

    - name: Get existing model settings
      uri:
        url: "{{ open_webui_url }}/api/v1/models/all"
        headers:
          Authorization: "Bearer {{ webui_token }}"
      register: existing_models
      changed_when: false
      no_log: true

    - name: Apply model compaction thresholds
      uri:
        url: "{{ open_webui_url }}/api/v1/models/import"
        method: POST
        headers:
          Authorization: "Bearer {{ webui_token }}"
        body_format: json
        body:
          models:
            - id: "{{ item.id }}"
              name: "{{ current_model.get('name', item.id) }}"
              params: "{{ (current_model.get('params') | default({}, true)) | combine({'compact_token_threshold': item.threshold}) }}"
              meta: "{{ current_model.get('meta') | default({}, true) }}"
        status_code: 200
      vars:
        current_model: >-
          {{
            existing_models.json
            | selectattr('id', 'equalto', item.id)
            | first
            | default({})
          }}
      loop: "{{ open_webui_models }}"
      loop_control:
        label: "{{ item.id }}"
      when: >
        (current_model.get('params', {}).get('compact_token_threshold', 0) | int)
        != item.threshold
      no_log: true
      changed_when: true

    - name: Hide non-chat models
      uri:
        url: "{{ open_webui_url }}/api/v1/models/import"
        method: POST
        headers:
          Authorization: "Bearer {{ webui_token }}"
        body_format: json
        body:
          models:
            - id: "{{ item }}"
              name: "{{ current_model.get('name', item) }}"
              params: "{{ current_model.get('params') | default({}, true) }}"
              meta: "{{ (current_model.get('meta') | default({}, true)) | combine({'hidden': true}) }}"
        status_code: 200
      vars:
        current_model: >-
          {{
            existing_models.json
            | selectattr('id', 'equalto', item)
            | first
            | default({})
          }}
      loop: "{{ open_webui_hidden_models }}"
      loop_control:
        label: "{{ item }}"
      when: not (current_model.get('meta', {}).get('hidden', false) | bool)
      no_log: true
      changed_when: true

    - name: Make selected models public
      uri:
        url: "{{ open_webui_url }}/api/v1/models/model/access/update"
        method: POST
        headers:
          Authorization: "Bearer {{ webui_token }}"
        body_format: json
        body:
          id: "{{ item }}"
          name: "{{ current_model.get('name', item) }}"
          access_grants: "{{ current_grants + [public_grant] }}"
        status_code: 200
      vars:
        current_model: >-
          {{
            existing_models.json
            | selectattr('id', 'equalto', item)
            | first
            | default({})
          }}
        current_grants: "{{ current_model.get('access_grants', []) }}"
        public_grant:
          principal_type: user
          principal_id: "*"
          permission: read
      loop: "{{ open_webui_public_models }}"
      loop_control:
        label: "{{ item }}"
      when: >-
        (
          current_grants
          | selectattr('principal_type', 'equalto', 'user')
          | selectattr('principal_id', 'equalto', '*')
          | selectattr('permission', 'equalto', 'read')
          | list
          | length
        ) == 0
      no_log: true
      changed_when: true
