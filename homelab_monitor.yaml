
---
- name: Deploy Homelab Temp Monitor
  hosts: ms01

  vars_files:
    - common.yaml

  vars:
    monitor_src: "{{ playbook_dir }}/services/homelab-monitor"
    monitor_dir: /home/rex/homelab/homelab-monitor

  tasks:
    - name: Create monitor directories
      file:
        path: "{{ item }}"
        state: directory
        owner: rex
        group: rex
        mode: "0755"
      loop:
        - "{{ monitor_dir }}"
        - "{{ monitor_dir }}/static"

    - name: Deploy backend scripts
      copy:
        src: "{{ monitor_src }}/{{ item }}"
        dest: "{{ monitor_dir }}/{{ item }}"
        owner: rex
        group: rex
        mode: "0755"
      loop:
        - server.py
        - collect_linux.py
        - collect_flashstor.sh
      notify: Restart Homelab Temp Monitor

    - name: Deploy configuration
      copy:
        src: "{{ monitor_src }}/config.json"
        dest: "{{ monitor_dir }}/config.json"
        owner: rex
        group: rex
        mode: "0644"
      notify: Restart Homelab Temp Monitor

    - name: Deploy static assets
      copy:
        src: "{{ monitor_src }}/static/"
        dest: "{{ monitor_dir }}/static/"
        owner: rex
        group: rex
        mode: preserve
        directory_mode: "0755"
      notify: Restart Homelab Temp Monitor

    - name: Install systemd service
      become: true
      copy:
        dest: /etc/systemd/system/homelab-temp-monitor.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Homelab Temp Monitor
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=rex
          Group=rex
          WorkingDirectory={{ monitor_dir }}
          Environment=HOME=/home/rex
          Environment=PYTHONUNBUFFERED=1
          ExecStart=/usr/bin/python3 {{ monitor_dir }}/server.py --bind {{ ms01_ip }} --port 8765
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          UMask=0077

          [Install]
          WantedBy=multi-user.target
      notify: Restart Homelab Temp Monitor

    - name: Enable and start service
      become: true
      systemd_service:
        name: homelab-temp-monitor.service
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Homelab Temp Monitor
      become: true
      systemd_service:
        name: homelab-temp-monitor.service
        state: restarted
        daemon_reload: true
